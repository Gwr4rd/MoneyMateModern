plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "com.codex.moneymate"
    compileSdk 35

    defaultConfig {
        applicationId "com.codex.moneymate"
        minSdk 29
        targetSdk 35
        versionCode 21
        versionName "2.0.1"
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
